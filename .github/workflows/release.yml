name: Release

# DESIGN section 16.3. A tag `v<version>` builds the three artifacts and publishes a release;
# a manual run (workflow_dispatch) with `dry_run: true` (the default) builds and uploads the
# artifacts to the workflow run only and creates no release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and upload workflow artifacts only (no GitHub release)
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  ORT_VERSION: 1.24.2

jobs:
  # Job 0: the whole CI matrix must pass before anything is built for release.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  version:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: read
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' crates/gui/Cargo.toml | head -n 1)"
          test -n "$version"
          echo "Cargo version: $version"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [[ "$tag" != "$version" ]]; then
              echo "The tag ${GITHUB_REF_NAME} does not match crates/gui/Cargo.toml version $version" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain (rust-toolchain.toml)
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows
      - name: Cache the ONNX Runtime download
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/ort.pyke.io
          key: ort-Windows-${{ hashFiles('Cargo.lock') }}
      - name: Build
        run: cargo build -p claude-history-gui --release --locked
      - name: DirectML must be delay-loaded
        shell: pwsh
        run: ./tools/ci/check-delayload.ps1 -Exe target/release/claude-history-gui.exe
      - name: Package
        shell: pwsh
        run: ./packaging/windows/make-zip.ps1 -Exe target/release/claude-history-gui.exe -Version $env:VERSION -OutDir dist
      - name: Verify the zip
        shell: pwsh
        run: |
          $zip = "dist/claude-history-gui-v$env:VERSION-windows-x86_64.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $names = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip)).Entries.Name
          foreach ($want in 'claude-history-gui.exe', 'MSVCP140.dll', 'MSVCP140_1.dll', 'VCRUNTIME140.dll', 'VCRUNTIME140_1.dll', 'README.txt', 'LICENSE', 'LICENSE-MIT') {
            if ($names -notcontains $want) { throw "$want is missing from $zip" }
          }
          Expand-Archive -Path $zip -DestinationPath unzipped
          ./tools/ci/check-console.ps1 -Exe unzipped/claude-history-gui.exe
      - uses: actions/upload-artifact@v5
        with:
          name: windows-x86_64
          path: |
            dist/*.zip
            dist/*.sha256

  macos:
    needs: version
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain (rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos-arm64
      - name: Download ONNX Runtime
        run: |
          set -euo pipefail
          ort_sha256="0af4fa503e8ea285245b47ee42d0a7461b8156a81270857da0c1d4ecf858abde"
          ort_url="https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-osx-arm64-${ORT_VERSION}.tgz"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 600 \
            --output onnxruntime.tgz "$ort_url"
          printf '%s  %s\n' "$ort_sha256" onnxruntime.tgz | shasum -a 256 --check -
          mkdir -p onnxruntime
          tar -xzf onnxruntime.tgz -C onnxruntime --strip-components=1
      - name: Build
        run: cargo build -p claude-history-gui --release --locked --target aarch64-apple-darwin --features release-dynamic-ort
      - name: Package (.app, ad-hoc signed)
        run: |
          bash packaging/macos/make-app.sh \
            target/aarch64-apple-darwin/release/claude-history-gui onnxruntime "$VERSION" dist
      - name: Verify the bundle
        run: |
          set -euo pipefail
          rm -rf unzipped && mkdir unzipped
          ditto -x -k "dist/claude-history-gui-v${VERSION}-macos-aarch64.zip" unzipped
          app="unzipped/Claude History.app"
          codesign --verify --deep --strict "$app"
          ls "$app"/Contents/MacOS/lib/libonnxruntime*.dylib
          test -f "$app/Contents/Resources/app.icns"
          plutil -lint "$app/Contents/Info.plist"
          "$app/Contents/MacOS/claude-history-gui" --version
          # Really load the bundled dylib (ort::init_from), not just start the binary.
          out="$(CLAUDE_HISTORY_GUI_ORT_SELFTEST=1 "$app/Contents/MacOS/claude-history-gui")"
          test "$out" = "onnxruntime ok"
      - uses: actions/upload-artifact@v5
        with:
          name: macos-aarch64
          path: |
            dist/*.zip
            dist/*.sha256

  linux:
    needs: version
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1 mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-x64
      - name: Download ONNX Runtime
        run: |
          set -euo pipefail
          ort_sha256="43725474ba5663642e17684717946693850e2005efbd724ac72da278fead25e6"
          ort_url="https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 600 \
            --output onnxruntime.tgz "$ort_url"
          printf '%s  %s\n' "$ort_sha256" onnxruntime.tgz | sha256sum --check -
          mkdir -p onnxruntime
          tar -xzf onnxruntime.tgz -C onnxruntime --strip-components=1
      - name: Build
        run: cargo build -p claude-history-gui --release --locked --features release-dynamic-ort
      - name: Package
        run: bash packaging/linux/make-tarball.sh target/release/claude-history-gui onnxruntime "$VERSION" dist
      - name: Verify the tarball
        run: |
          set -euo pipefail
          archive="dist/claude-history-gui-v${VERSION}-linux-x86_64.tar.gz"
          listing="$(tar -tzf "$archive")"
          for want in claude-history-gui claude-history-gui.desktop claude-history-gui.png lib/libonnxruntime.so LICENSE LICENSE-MIT; do
            grep -q "/${want}\$" <<<"$listing" || { echo "$want is missing from $archive" >&2; exit 1; }
          done
          grep -q '/lib/libonnxruntime\.so\.' <<<"$listing"
          mkdir unpacked && tar -xzf "$archive" -C unpacked
          "unpacked/claude-history-gui-v${VERSION}-linux-x86_64/claude-history-gui" --version
          # Really load the bundled library (ort::init_from), not just start the binary.
          out="$(CLAUDE_HISTORY_GUI_ORT_SELFTEST=1 "unpacked/claude-history-gui-v${VERSION}-linux-x86_64/claude-history-gui")"
          test "$out" = "onnxruntime ok"
      - uses: actions/upload-artifact@v5
        with:
          name: linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256

  # Intel macOS is not built in v1: ort-sys ships no static ONNX Runtime for x86_64-apple-darwin
  # and the macos-13 image is retired. A follow-up may copy upstream's macos-15-intel source-build job.

  publish:
    # A dry run (workflow_dispatch with dry_run) stops after the builds above.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify the three artifacts
        run: |
          set -euo pipefail
          cd artifacts
          for artifact in \
            "claude-history-gui-v${VERSION}-windows-x86_64.zip" \
            "claude-history-gui-v${VERSION}-macos-aarch64.zip" \
            "claude-history-gui-v${VERSION}-linux-x86_64.tar.gz"; do
            test -s "$artifact"
            test -s "$artifact.sha256"
            sha256sum --check "$artifact.sha256"
          done
      - name: Release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          awk -v v="v${VERSION}" '
            $0 ~ "^## " v "([ ]|$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no '## v${VERSION}' section" >&2; exit 1; }
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          body_path: release-notes.md
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.sha256
